<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola Mundo API</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        h1 {
            color: #1a1a2e;
            margin-bottom: 10px;
            font-size: 2rem;
        }

        .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 1rem;
        }

        .cards {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 800px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 28px;
            width: 360px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card h2 {
            font-size: 1.2rem;
            color: #1a1a2e;
            margin-bottom: 6px;
        }

        .card .endpoint {
            font-family: monospace;
            background: #e8f5e9;
            color: #2e7d32;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            display: inline-block;
            margin-bottom: 16px;
        }

        input {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 12px;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #4361ee;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #4361ee;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #3a56d4;
        }

        .resultado {
            margin-top: 16px;
            padding: 14px;
            border-radius: 8px;
            background: #f8f9fa;
            border-left: 4px solid #4361ee;
            font-family: monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
            word-break: break-word;
            display: none;
        }

        .resultado.visible {
            display: block;
        }

        .resultado.error {
            border-left-color: #e74c3c;
            background: #fdf0ef;
            color: #c0392b;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            background: #ccc;
        }

        .status-dot.ok { background: #2ecc71; }
        .status-dot.fail { background: #e74c3c; }

        .status-text {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <h1>🚀 Hola Mundo API</h1>
    <p class="subtitle">Mi primer proyecto Spring Boot</p>

    <div class="cards">

        <!-- Card 1: Health Check -->
        <div class="card">
            <h2>Health Check</h2>
            <span class="endpoint">GET /api/health</span>

            <p class="status-text">
                <span id="statusDot" class="status-dot"></span>
                <span id="statusText">Sin verificar</span>
            </p>

            <button onclick="checkHealth()">Verificar API</button>

            <div id="healthResult" class="resultado"></div>
        </div>

        <!-- Card 2: Welcome -->
        <div class="card">
            <h2>Saludo Personalizado</h2>
            <span class="endpoint">GET /api/welcome/{nombre}</span>

            <input type="text" id="nombreInput" placeholder="Escribe tu nombre..." />

            <button onclick="saludar()">Saludar</button>

            <div id="welcomeResult" class="resultado"></div>
        </div>

    </div>

    <script>
        // ========================================
        // Función para verificar si la API está OK
        // ========================================
        function checkHealth() {
            var resultDiv = document.getElementById('healthResult');
            var dot = document.getElementById('statusDot');
            var text = document.getElementById('statusText');

            // fetch = hacer una petición HTTP desde el navegador
            fetch('/api/health')
                .then(function(response) {
                    return response.json(); // convertir respuesta a JSON
                })
                .then(function(data) {
                    // Si llegamos acá, la API respondió bien
                    dot.className = 'status-dot ok';
                    text.textContent = 'API funcionando';

                    resultDiv.className = 'resultado visible';
                    resultDiv.textContent = JSON.stringify(data, null, 2);
                })
                .catch(function(error) {
                    // Si hay error (API caída, etc.)
                    dot.className = 'status-dot fail';
                    text.textContent = 'API no disponible';

                    resultDiv.className = 'resultado visible error';
                    resultDiv.textContent = 'Error: No se pudo conectar a la API';
                });
        }

        // ========================================
        // Función para saludar con nombre
        // ========================================
        function saludar() {
            var nombre = document.getElementById('nombreInput').value.trim();
            var resultDiv = document.getElementById('welcomeResult');

            // Validar que escribió algo
            if (!nombre) {
                resultDiv.className = 'resultado visible error';
                resultDiv.textContent = 'Escribe tu nombre primero';
                return;
            }

            fetch('/api/welcome/' + nombre)
                .then(function(response) {
                    return response.json();
                })
                .then(function(data) {
                    resultDiv.className = 'resultado visible';
                    resultDiv.textContent = JSON.stringify(data, null, 2);
                })
                .catch(function(error) {
                    resultDiv.className = 'resultado visible error';
                    resultDiv.textContent = 'Error al conectar con la API';
                });
        }

        // Permitir saludar con Enter
        document.getElementById('nombreInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') saludar();
        });
    </script>

</body>
</html>
