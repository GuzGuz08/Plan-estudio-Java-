# Puerto donde corre la app (por defecto ya es 8080, pero lo dejamos explícito)
server.port=8080

# Nombre de la aplicación
spring.application.name=PersonasAPI

# ============================================
# DEFAULT PROFILE: PostgreSQL
# ============================================

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/personas
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate (validate — Flyway se encarga del esquema)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway con PostgreSQL
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Define el nombre y la ruta del archivo donde se guardarán los logs
logging.file.name=logs/reportes.log

# Define el nivel mínimo de los mensajes que quieres guardar (INFO, DEBUG, ERROR, etc.)
logging.level.root=INFO

# ============================
# SEGURIDAD - OWASP Top 10
# ============================

# No exponer stack traces en respuestas de error
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Ocultar versión del servidor
server.server-header=

# Limitar tamaño máximo del request body (prevenir DoS)
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB
server.tomcat.max-http-form-post-size=1MB
