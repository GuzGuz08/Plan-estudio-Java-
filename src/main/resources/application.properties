# Puerto donde corre la app (por defecto ya es 8080, pero lo dejamos explícito)
server.port=8080

# Nombre de la aplicación
spring.application.name=PersonasAPI

# Configuración de la base de datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/personas
spring.datasource.username=postgres
spring.datasource.password=password

# Driver de PostgreSQL 
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
# 'validate' para que Hibernate solo valide el esquema; Flyway se encarga de crearlo
spring.jpa.hibernate.ddl-auto=validate

# Mostrar las queries SQL en consola (útil para depuración)
spring.jpa.show-sql=true

# Flyway - migraciones de base de datos
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Define el nombre y la ruta del archivo donde se guardarán los logs
logging.file.name=logs/reportes.log

# Define el nivel mínimo de los mensajes que quieres guardar (INFO, DEBUG, ERROR, etc.)
logging.level.root=INFO
